@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

.cm-app{
  --bg:#F2EFE8; --surface:#FFFFFF; --surface-2:#FBFAF6;
  --ink:#1F1D1A; --muted:#94908A; --line:#E7E2D7;
  --pos:#2F6B4F; --neg:#B23A2E; --send:#9A6B1F; --gold:#A8842C;
  font-family:'Zen Kaku Gothic New',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; width:100%;
  -webkit-font-smoothing:antialiased;
}
.cm-app *{box-sizing:border-box;}
.cm-wrap{max-width:480px; margin:0 auto; padding:max(16px,env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom));}
.cm-loading{display:grid; place-items:center; min-height:60vh; color:var(--muted);}
.cm-num{font-family:'Fraunces',serif; font-feature-settings:"tnum" 1; font-variant-numeric:tabular-nums;}

/* month navigation (\u30AB\u30FC\u30C9\u5185\u306B\u914D\u7F6E\u3057\u3066\u5E38\u6642\u8868\u793A) */
.cm-monthnav{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:16px;}
.cm-hero .cm-monthnav{padding-bottom:14px; border-bottom:1px solid var(--line);}
.cm-monthlabel{display:inline-flex; align-items:center; gap:8px; min-width:150px; justify-content:center;
  background:none; border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:16px;
  color:var(--ink); padding:7px 12px; border-radius:10px; transition:.15s;}
.cm-monthlabel:hover,.cm-monthlabel:active{background:var(--surface-2);}
.cm-badge{font-size:10px; font-weight:700; color:var(--gold); border:1px solid var(--gold);
  border-radius:999px; padding:1px 7px; letter-spacing:.04em;}
.cm-iconbtn{display:grid; place-items:center; width:34px; height:34px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; transition:.15s;}
.cm-iconbtn:hover{background:var(--surface-2);}
.cm-err{background:#fdecea; color:var(--neg); border:1px solid #f3c9c4; border-radius:10px;
  padding:8px 12px; font-size:13px; margin-bottom:12px;}

/* hero */
.cm-hero{background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:26px 22px 22px; text-align:center; margin-bottom:14px; box-shadow:0 1px 0 rgba(0,0,0,.02);}
.cm-hero-label{font-size:12px; color:var(--muted); letter-spacing:.08em; margin-bottom:8px;}
.cm-balance{font-family:'Fraunces',serif; font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  font-weight:600; font-size:clamp(44px,13vw,58px); line-height:1; letter-spacing:-.01em; color:var(--ink);}
.cm-balance.neg{color:var(--neg);}
.cm-hero-sub{font-size:12.5px; color:var(--muted); margin-top:14px; line-height:1.6;}
.cm-hero-sub .cm-pos{color:var(--pos);}
.cm-hero-sub .cm-sub-sav{color:var(--gold);}
.cm-dot{margin:0 8px; opacity:.5;}
.cm-bar{height:7px; background:#ECE7DC; border-radius:99px; overflow:hidden; margin-top:14px;}
.cm-bar-fill{height:100%; border-radius:99px; transition:width .6s cubic-bezier(.2,.8,.2,1);}
.cm-bar-cap{font-size:11px; color:var(--muted); margin-top:7px;}
.cm-cta{margin-top:16px; display:inline-flex; align-items:center; gap:6px; background:var(--ink);
  color:#fff; border:none; border-radius:11px; padding:10px 18px; font-weight:700; font-size:13px;
  cursor:pointer; font-family:inherit;}

/* cards */
.cm-card{background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:16px; margin-bottom:14px;}
.cm-mini{font-size:11px; color:var(--muted); letter-spacing:.05em;}

/* savings */
.cm-savings{display:flex; align-items:center; justify-content:space-between;}
.cm-sav-left{display:flex; align-items:center; gap:12px;}
.cm-sav-amt{font-family:'Fraunces',serif; font-variant-numeric:tabular-nums; font-weight:600;
  font-size:24px; color:var(--gold); margin-top:2px;}

/* segmented + form */
.cm-seg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:12px; padding:5px;}
.cm-seg-btn{display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 4px;
  border:none; background:none; border-radius:8px; font-family:inherit; font-weight:700; font-size:13px;
  color:var(--muted); cursor:pointer; transition:.15s;}
.cm-seg-btn.on{background:var(--surface); box-shadow:0 1px 4px rgba(0,0,0,.07);}
.cm-form-row{margin-top:12px;}
.cm-form-bottom{display:flex; gap:8px;}
.cm-amt-wrap{display:flex; align-items:center; border:1px solid var(--line); border-radius:11px;
  background:var(--surface-2); padding:0 14px;}
.cm-yen{color:var(--muted); font-family:'Fraunces',serif; font-size:18px; margin-right:6px;}
.cm-amt{font-family:'Fraunces',serif !important; font-variant-numeric:tabular-nums; font-size:22px !important;
  font-weight:500; border:none !important; background:none !important; padding:12px 0 !important;}
.cm-input{flex:1; width:100%; border:1px solid var(--line); border-radius:11px; background:var(--surface-2);
  padding:12px 14px; font-family:inherit; font-size:14px; color:var(--ink); outline:none; transition:.15s;}
.cm-input:focus{border-color:var(--ink); background:var(--surface);}
.cm-input.bad{border-color:var(--neg);}

/* buttons */
.cm-btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:11px;
  font-family:inherit; font-weight:700; font-size:13.5px; cursor:pointer; transition:.15s; border:1px solid transparent;}
.cm-btn-primary{background:var(--ink); color:#fff; padding:12px 20px;}
.cm-btn-primary:hover{opacity:.9;}
.cm-btn-primary:disabled{opacity:.35; cursor:default;}
.cm-btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink); padding:10px 16px;}
.cm-btn-ghost:hover{background:var(--surface-2);}
.cm-sm{padding:7px 11px; font-size:12px;}
.cm-danger{color:var(--neg);}
.cm-block{width:100%; margin-top:16px; padding:14px;}
.cm-link{background:none; border:none; color:var(--ink); font-family:inherit; font-size:12px;
  font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}

/* txn list */
.cm-list-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.cm-txns{display:flex; flex-direction:column;}
.cm-txn{display:flex; align-items:center; gap:11px; padding:11px 2px; border-bottom:1px solid var(--line);}
.cm-txn:last-child{border-bottom:none;}
.cm-txn-ic{display:grid; place-items:center; width:30px; height:30px; border-radius:9px; background:var(--surface-2); flex-shrink:0;}
.cm-txn-main{flex:1; min-width:0;}
.cm-txn-memo{font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cm-txn-date{font-size:11px; color:var(--muted); margin-top:1px;}
.cm-txn-amt{font-family:'Fraunces',serif; font-variant-numeric:tabular-nums; font-weight:600; font-size:15px; flex-shrink:0;}
.cm-txn-actions{display:flex; gap:2px; flex-shrink:0;}
.cm-tiny{display:grid; place-items:center; width:28px; height:28px; border:none; background:none;
  color:var(--muted); border-radius:7px; cursor:pointer; transition:.15s;}
.cm-tiny:hover{background:var(--surface-2); color:var(--ink);}
.cm-empty{text-align:center; color:var(--muted); font-size:13px; padding:18px 0;}

/* summary / history */
.cm-summary{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px;}
.cm-sum-item{background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:10px 8px; text-align:center;}
.cm-sum-val{font-family:'Fraunces',serif; font-variant-numeric:tabular-nums; font-weight:600; font-size:14px; margin-top:3px;}
.cm-sum-val.neg{color:var(--neg);} .cm-sum-val.gold{color:var(--gold);}
.cm-summary2{font-size:12px; color:var(--muted); margin-top:12px;}
.cm-filter{display:flex; gap:7px; margin-bottom:6px; flex-wrap:wrap;}
.cm-chip{border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:99px; padding:6px 14px; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer; transition:.15s;}
.cm-chip.on{background:var(--ink); color:#fff; border-color:var(--ink);}
.cm-hist-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
.cm-foot-btns{display:flex; gap:7px;}

/* tabs */
.cm-tabs{position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
  display:grid; grid-template-columns:repeat(3,1fr); background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
.cm-tab{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none;
  font-family:inherit; font-size:10.5px; font-weight:700; color:var(--muted); padding:7px; border-radius:10px; cursor:pointer; transition:.15s;}
.cm-tab.on{color:var(--ink); background:var(--surface-2);}

/* modal */
.cm-overlay{position:fixed; inset:0; background:rgba(28,27,25,.34); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0;}
@media(min-width:520px){.cm-overlay{align-items:center; padding:20px;}}
.cm-modal{background:var(--surface); width:100%; max-width:440px; border-radius:22px 22px 0 0;
  padding:20px 20px calc(26px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,.16);}
@media(min-width:520px){.cm-modal{border-radius:20px;}}
.cm-modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.cm-modal-head h3{font-size:16px; font-weight:700; margin:0;}
.cm-field{display:block; margin-bottom:14px;}
.cm-field .cm-mini{display:block; margin-bottom:6px;}
.cm-field .cm-amt-wrap{margin-top:0;}
.cm-calc{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:7px 2px;}
.cm-calc span:last-child{font-family:'Fraunces',serif; font-variant-numeric:tabular-nums; color:var(--ink);}
.cm-calc-strong{border-top:1px solid var(--line); margin-top:4px; padding-top:11px; font-weight:700;}
.cm-calc-strong span{color:var(--ink) !important; font-size:14px;}
.cm-warn{color:var(--neg); font-size:12px; margin:-6px 0 8px;}

/* motion */
@keyframes cmRise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.cm-rise{animation:cmRise .5s cubic-bezier(.2,.8,.2,1) both;}
@keyframes cmPop{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
.cm-pop{animation:cmPop .28s cubic-bezier(.2,.8,.2,1) both;}
@media (prefers-reduced-motion: reduce){.cm-rise,.cm-pop{animation:none;}}

/* cloud: sync + setup + settings */
.cm-setup{display:flex; align-items:center; min-height:90vh;}
.cm-setup-title{font-size:18px; font-weight:700; margin-bottom:6px;}
.cm-setup-lead{font-size:13px; color:var(--muted); line-height:1.7; margin:0 0 16px;}
.cm-setup-lead b{color:var(--ink);}
.cm-setup-note{font-size:11.5px; color:var(--muted); line-height:1.7; margin-top:14px;}
.cm-sync{display:inline-flex; align-items:center; gap:5px; border:none; background:none; cursor:pointer;
  font-family:inherit; font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px;}
.cm-sync-ok{color:var(--pos);} .cm-sync-syncing{color:var(--muted);} .cm-sync-error{color:var(--neg);}
.cm-hero .cm-sync{margin:-4px 0 6px;}
.cm-spin{animation:cmSpin 1s linear infinite;}
@keyframes cmSpin{to{transform:rotate(360deg);}}
.cm-set-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 2px; border-bottom:1px solid var(--line);}
.cm-set-url{font-size:12px; color:var(--ink); word-break:break-all; text-align:right;}
.cm-set-actions{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
.cm-set-actions .cm-block{margin-top:0;}
